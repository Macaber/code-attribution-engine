# Attribution Worker Configurations
attribution.worker.threads=2

# L2 Trivial Match Filter Configuration
attribution.l2.filter-trivial.enabled=true
attribution.l2.filter-trivial.lines={,},<div>,</div>

# AI Message Query Configurations
attribution.worker.ai-message.limit=1000
attribution.worker.ai-message.timeframe-days=30

# Attribution File/Diff Filtering Configurations
attribution.filter.enabled=true
attribution.filter.exclude-extensions=log,txt,png,jpg,jpeg,gif,pdf,zip,tar,gz,exe,dll,so,bin,woff,ttf,class,jar,lock,csv,tsv,xlsx
attribution.filter.code-extensions=java,ts,js,vue,py,go,c,cpp,h,cs,php,rb,html,css,sql,sh,json,xml,yml,yaml
attribution.filter.max-file-size-kb=500
attribution.filter.max-diff-size-kb=100
attribution.filter.max-file-lines=5000
attribution.filter.filter-binary=true
attribution.filter.filter-logs=true

# Server Port Configuration
server.port=${PORT:3000}

# Database Configurations
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:code_attribution}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:attribution123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis & Redisson Configurations
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}



